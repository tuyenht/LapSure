name: Apply Bluetooth Evidence Fix

on:
  push:
    branches:
      - feature/s01-s04-visual-alignment-v2
    paths:
      - tools/apply_bluetooth_evidence_fix.py
      - .github/workflows/apply-bluetooth-evidence-fix.yml

permissions:
  contents: write

jobs:
  apply-validate-clean:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/s01-s04-visual-alignment-v2
          fetch-depth: 0

      - name: Apply Bluetooth evidence semantics
        shell: pwsh
        run: python tools/apply_bluetooth_evidence_fix.py

      - name: Diff sanity
        shell: pwsh
        run: git diff --check -- src/functional_io.cpp

      - name: Source and evidence regression gates
        shell: cmd
        run: run_source_tests.cmd

      - name: Configure MSVC x64 strict
        shell: cmd
        run: cmake --preset msvc-x64-ci

      - name: Build Release
        shell: cmd
        run: cmake --build --preset build-msvc-x64-ci

      - name: Executable behavioral tests
        shell: cmd
        run: ctest --test-dir out/build/msvc-x64-ci -C Release --output-on-failure

      - name: Commit validated production fix and remove migration scaffolding
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/apply_bluetooth_evidence_fix.py .github/workflows/apply-bluetooth-evidence-fix.yml
          git add src/functional_io.cpp
          git commit -m "fix(functional): require known-good Bluetooth interaction before PASS"
          git push origin HEAD:feature/s01-s04-visual-alignment-v2
