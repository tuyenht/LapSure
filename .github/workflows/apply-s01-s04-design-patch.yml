name: Apply S01 S04 Design Patch

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lapsure-design-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4

      - name: Apply renderer patch in runner workspace only
        shell: pwsh
        run: python tools/apply_s01_s04_design_patch.py

      - name: Diff sanity
        shell: pwsh
        run: git diff --check

      - name: Strict MSVC x64 Release build
        shell: cmd
        run: build_msvc_ci.cmd

      - name: Source and behavioral regression tests
        shell: cmd
        run: run_source_tests.cmd

      - name: Show validated workspace diff
        shell: pwsh
        run: git diff -- src/main.cpp
