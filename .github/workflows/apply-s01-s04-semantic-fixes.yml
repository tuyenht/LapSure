name: Apply S01 S04 Semantic Fixes

on:
  push:
    branches:
      - feature/s01-s04-visual-alignment-v2
    paths:
      - tools/apply_s01_s04_semantic_fixes.py
      - .github/workflows/apply-s01-s04-semantic-fixes.yml

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/s01-s04-visual-alignment-v2
          fetch-depth: 0

      - name: Apply deterministic semantic patch
        shell: pwsh
        run: python tools/apply_s01_s04_semantic_fixes.py

      - name: Diff sanity
        shell: pwsh
        run: git diff --check

      - name: Source and evidence regression gates
        shell: cmd
        run: run_source_tests.cmd

      - name: Configure MSVC x64 strict
        shell: cmd
        run: cmake --preset msvc-x64-ci

      - name: Build Release
        shell: cmd
        run: cmake --build --preset build-msvc-x64-ci

      - name: Executable behavioral tests
        shell: cmd
        run: ctest --test-dir out/build/msvc-x64-ci -C Release --output-on-failure

      - name: Commit validated runtime fixes
        shell: pwsh
        run: |
          $changed = git status --porcelain -- src/ui_screens_s01_s04_v2.cpp src/main.cpp CMakeLists.txt
          if ($changed) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/ui_screens_s01_s04_v2.cpp src/main.cpp CMakeLists.txt
            git commit -m "ui: harden S01/S04 runtime evidence semantics"
            git push origin HEAD:feature/s01-s04-visual-alignment-v2
          } else {
            Write-Host "No runtime semantic changes to commit."
          }
