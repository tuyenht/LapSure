name: Apply S01 S04 Semantic Fixes

on:
  push:
    branches:
      - feature/s01-s04-visual-alignment-v2
    paths:
      - tools/apply_s01_s04_semantic_fixes.py
      - tools/apply_s01_s04_compile_truth_fixes.py
      - .github/workflows/apply-s01-s04-semantic-fixes.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/apply_s01_s04_semantic_fixes.py
      - tools/apply_s01_s04_compile_truth_fixes.py
      - .github/workflows/apply-s01-s04-semantic-fixes.yml
      - src/ui_screens_s01_s04_v2.cpp
      - src/ui_shell_dynamic.cpp
      - src/main.cpp
      - CMakeLists.txt
      - src/scoring.cpp
      - tests/s01_s04_dynamic_binding_sanity.py

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/s01-s04-visual-alignment-v2
          fetch-depth: 0

      - name: Normalize temporary patch script quoting
        shell: pwsh
        run: |
          $p = 'tools/apply_s01_s04_semantic_fixes.py'
          $s = Get-Content -LiteralPath $p -Raw -Encoding UTF8
          $s = $s.Replace("'''',", '"",')
          Set-Content -LiteralPath $p -Value $s -Encoding UTF8

      - name: Apply deterministic semantic patch
        shell: pwsh
        run: python tools/apply_s01_s04_semantic_fixes.py

      - name: Apply strict MSVC and stage-truth patch
        shell: pwsh
        run: python tools/apply_s01_s04_compile_truth_fixes.py

      - name: Diff sanity for production targets
        shell: pwsh
        run: git diff --check -- src/ui_screens_s01_s04_v2.cpp src/main.cpp CMakeLists.txt

      - name: Source and evidence regression gates
        shell: cmd
        run: run_source_tests.cmd

      - name: Configure MSVC x64 strict
        shell: cmd
        run: cmake --preset msvc-x64-ci

      - name: Build Release
        shell: cmd
        run: cmake --build --preset build-msvc-x64-ci

      - name: Executable behavioral tests
        shell: cmd
        run: ctest --test-dir out/build/msvc-x64-ci -C Release --output-on-failure

      - name: Commit validated runtime fixes
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $changed = git status --porcelain -- src/ui_screens_s01_s04_v2.cpp src/main.cpp CMakeLists.txt
          if ($changed) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/ui_screens_s01_s04_v2.cpp src/main.cpp CMakeLists.txt
            git commit -m "ui: harden S01/S04 runtime evidence semantics"
            git push origin HEAD:feature/s01-s04-visual-alignment-v2
          } else {
            Write-Host "No runtime semantic changes to commit."
          }
