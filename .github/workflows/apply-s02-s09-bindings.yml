name: Apply S02-S09 Runtime Bindings

on:
  push:
    branches:
      - feature/s01-s04-visual-alignment-v2
    paths:
      - tools/apply_s02_s09_bindings.py
      - .github/workflows/apply-s02-s09-bindings.yml

permissions:
  contents: write

jobs:
  bind-validate-clean:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/s01-s04-visual-alignment-v2
          fetch-depth: 0

      - name: Apply runtime binding
        shell: pwsh
        run: python tools/apply_s02_s09_bindings.py

      - name: Diff sanity
        shell: pwsh
        run: git diff --check -- src/main.cpp include/lap/ui_screens.h src/ui_screens_s02_s09_v2.cpp CMakeLists.txt tests/s02_s09_dynamic_binding_sanity.py run_source_tests.cmd

      - name: Source and evidence regression gates
        shell: cmd
        run: run_source_tests.cmd

      - name: Configure MSVC x64 strict
        shell: cmd
        run: cmake --preset msvc-x64-ci

      - name: Build Release
        shell: cmd
        run: cmake --build --preset build-msvc-x64-ci

      - name: Executable behavioral tests
        shell: cmd
        run: ctest --test-dir out/build/msvc-x64-ci -C Release --output-on-failure

      - name: Commit validated binding and remove migration scaffolding
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/apply_s02_s09_bindings.py .github/workflows/apply-s02-s09-bindings.yml
          git add src/main.cpp
          git commit -m "ui: bind S02-S09 production renderers to runtime state"
          git push origin HEAD:feature/s01-s04-visual-alignment-v2
